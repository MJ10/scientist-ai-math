[project]
name = "scientist-ai-math"
version = "0.1.0"
description = "A small Scientist AI vs RL under hackable graders: word problems with a leaked answer key"
requires-python = ">=3.12,<3.14"
dependencies = [
    "jax[cuda12]==0.11.2 ; sys_platform == 'linux'",
    "jax==0.11.2 ; sys_platform == 'darwin'",
    "numpy==2.5.3",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
wandb = ["wandb"]

[tool.uv]
package = false
